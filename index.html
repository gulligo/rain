<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 지도 기반 강수 레이더</title>
    <style>
        html, body, #map {
            width: 100%; height: 100%; margin: 0; padding: 0;
        }
        /* 하단 컨트롤러 영역 */
        .control-bar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 10px 20px; border-radius: 20px;
            display: flex; align-items: center; gap: 15px;
            z-index: 1000;
        }
        .control-bar button {
            background: none; border: none; color: white;
            font-size: 18px; cursor: pointer;
        }
    </style>
    <!-- Google Maps API 호출 (API 키 필요) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_KEY"></script>
</head>
<body>

    <div id="map"></div>

    <div class="control-bar">
        <button onclick="prevFrame()">◀</button>
        <button id="play-btn" onclick="togglePlay()">▶</button>
        <button onclick="nextFrame()">▶</button>
        <span id="time-text">시간 표시</span>
    </div>

    <script>
        var map, radarOverlay;
        var frames = [];
        var currentIndex = 0;
        var isPlaying = false;
        var timer = null;

        // 대한민국 레이더 이미지 영역 범위 (위도/경도)
        var radarBounds = {
            north: 38.9,
            south: 32.5,
            east: 131.5,
            west: 124.0
        };

        function initMap() {
            // 1. 구글 지도 생성 (중심: 대한민국)
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 7,
                center: { lat: 36.3, lng: 127.8 },
                mapTypeId: 'roadmap'
            });

            // 2. 현재 내 위치 파란 점 표시
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    new google.maps.Marker({
                        position: { lat: pos.coords.latitude, lng: pos.coords.longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 6,
                            fillColor: '#0055FF',
                            fillOpacity: 1,
                            strokeColor: '#FFFFFF',
                            strokeWeight: 2
                        }
                    });
                });
            }

            // 3. 최근 시간대별 레이더 PNG 파일 목록 생성 (5분 간격)
            makeFrameList();
            showRadarFrame(frames.length - 1);
        }

        function pad(n){ return String(n).padStart(2,'0'); }

        function makeFrameList() {
            var now = new Date(Date.now() - 10*60000);
            var mins = now.getMinutes();
            now.setMinutes(mins - (mins % 5), 0, 0);

            for (var i = 12; i >= 0; i--) {
                var t = new Date(now.getTime() - i*5*60000);
                var tm = t.getFullYear() + pad(t.getMonth()+1) + pad(t.getDate()) + pad(t.getHours()) + pad(t.getMinutes());
                
                frames.push({
                    timeLabel: pad(t.getMonth()+1) + '월 ' + pad(t.getDate()) + '일 ' + pad(t.getHours()) + ':' + pad(t.getMinutes()),
                    // 기상청 레이더 이미지 URL
                    url: 'https://www.kma.go.kr/repositary/image/rdr/img/RDR_CMP_WRC_' + tm + '.png'
                });
            }
        }

        // 구글 지도 위에 레이더 이미지를 레이어로 씌우는 함수
        function showRadarFrame(index) {
            currentIndex = index;
            var f = frames[index];

            if (radarOverlay) {
                radarOverlay.setMap(null); // 기존 이미지 제거
            }

            // 구글 지도의 GroundOverlay 기능 활용 (투명도 0.6 설정)
            radarOverlay = new google.maps.GroundOverlay(f.url, radarBounds, { opacity: 0.6 });
            radarOverlay.setMap(map);

            document.getElementById('time-text').innerText = f.timeLabel;
        }

        function prevFrame() {
            if (currentIndex > 0) showRadarFrame(currentIndex - 1);
        }
        function nextFrame() {
            if (currentIndex < frames.length - 1) showRadarFrame(currentIndex + 1);
        }
        function togglePlay() {
            if (isPlaying) {
                clearInterval(timer);
                document.getElementById('play-btn').innerText = '▶';
                isPlaying = false;
            } else {
                isPlaying = true;
                document.getElementById('play-btn').innerText = '❚❚';
                timer = setInterval(function() {
                    var next = (currentIndex + 1) % frames.length;
                    showRadarFrame(next);
                }, 800);
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
