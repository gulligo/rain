<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기상청 초단기예보 조회</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 10px; }
        .status { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        th { color: #00897b; }
        .rain { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>현재 위치 초단기예보</h2>
    <div id="status" class="status">위치 확인 중...</div>
    <table id="forecast-table" style="display:none;">
        <thead>
            <tr>
                <th>시간</th>
                <th>날씨</th>
                <th>강수량</th>
                <th>기온</th>
            </tr>
        </thead>
        <tbody id="forecast-body"></tbody>
    </table>
</div>

<script>
    // 1. 공공데이터포털에서 발급받은 일반 인증키(Encoding 또는 Decoding)를 입력하세요.
    const SERVICE_KEY = '여기에_발급받은_서비스키를_넣으세요';

    // 위경도 -> 기상청 격자(NX, NY) 변환 함수
    function dfs_xy_conv(lat, lon) {
        const RE = 6371.00877, GRID = 5.0, SLAT1 = 30.0, SLAT2 = 60.0, OLON = 126.0, OLAT = 38.0, XO = 43, YO = 136;
        const DEGRAD = Math.PI / 180.0;
        const re = RE / GRID, slat1 = SLAT1 * DEGRAD, slat2 = SLAT2 * DEGRAD, olon = OLON * DEGRAD, olat = OLAT * DEGRAD;
        let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
        sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
        let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
        sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
        let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
        ro = re * sf / Math.pow(ro, sn);
        let ra = Math.tan(Math.PI * 0.25 + lat * DEGRAD * 0.5);
        ra = re * sf / Math.pow(ra, sn);
        let theta = lon * DEGRAD - olon;
        if (theta > Math.PI) theta -= 2.0 * Math.PI;
        if (theta < -Math.PI) theta += 2.0 * Math.PI;
        theta *= sn;
        return {
            nx: Math.floor(ra * Math.sin(theta) + XO + 0.5),
            ny: Math.floor(ro - ra * Math.cos(theta) + YO + 0.5)
        };
    }

    // 발표 시각 계산 (초단기예보는 매시 30분에 생성됨)
    function getBaseDateTime() {
        const now = new Date(Date.now() - 45 * 60000); // 안전하게 45분 전 기준
        const pad = n => String(n).padStart(2, '0');
        const y = now.getFullYear();
        const m = pad(now.getMonth() + 1);
        const d = pad(now.getDate());
        const h = pad(now.getHours());
        return {
            baseDate: `${y}${m}${d}`,
            baseTime: `${h}30`
        };
    }

    // 날씨 코드 해석 매핑
    const SKY_MAP = { '1': '맑음', '3': '구름많음', '4': '흐림' };
    const PTY_MAP = { '0': '없음', '1': '비', '2': '비/눈', '3': '눈', '5': '빗방울', '6': '빗방울눈날림', '7': '눈날림' };

    // API 호출 및 데이터 출력
    async function fetchForecast(lat, lon) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = '예보 데이터를 불러오는 중...';

        const grid = dfs_xy_conv(lat, lon);
        const { baseDate, baseTime } = getBaseDateTime();

        const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst`
            + `?serviceKey=${SERVICE_KEY}`
            + `&pageNo=1&numOfRows=1000&dataType=JSON`
            + `&base_date=${baseDate}&base_time=${baseTime}`
            + `&nx=${grid.nx}&ny=${grid.ny}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (!data.response.body) {
                statusEl.innerText = '데이터를 불러오지 못했습니다. (인증키 확인 필요)';
                return;
            }

            const items = data.response.body.items.item;
            const timeGroup = {};

            // 시간별 데이터 파싱
            items.forEach(item => {
                const t = item.fcstTime;
                if (!timeGroup[t]) timeGroup[t] = {};
                timeGroup[t][item.category] = item.fcstValue;
            });

            const tbody = document.getElementById('forecast-body');
            tbody.innerHTML = '';

            Object.keys(timeGroup).sort().forEach(time => {
                const obs = timeGroup[time];
                const timeStr = `${time.substring(0, 2)}:00`;
                const pty = PTY_MAP[obs.PTY] || '없음';
                const sky = SKY_MAP[obs.SKY] || '';
                const weatherText = pty !== '없음' ? pty : sky;
                const rn1 = obs.RN1 === '강수없음' ? '-' : obs.RN1;
                const temp = `${obs.T1H}℃`;

                const row = document.createElement('tr');
                if (pty !== '없음') row.classList.add('rain');

                row.innerHTML = `
                    <td>${timeStr}</td>
                    <td>${weatherText}</td>
                    <td>${rn1}</td>
                    <td>${temp}</td>
                `;
                tbody.appendChild(row);
            });

            statusEl.innerText = `기준 시각: ${baseDate} ${baseTime.substring(0,2)}시 30분`;
            document.getElementById('forecast-table').style.display = 'table';

        } catch (error) {
            console.error(error);
            statusEl.innerText = 'API 요청 중 오류가 발생했습니다.';
        }
    }

    // 위치권한 획득 후 실행
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => fetchForecast(pos.coords.latitude, pos.coords.longitude),
            () => document.getElementById('status').innerText = '위치 권한 거부됨 (기본 위치 서울 설정 필요)'
        );
    } else {
        document.getElementById('status').innerText = 'GPS를 지원하지 않는 브라우저입니다.';
    }
</script>

</body>
</html>
