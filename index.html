<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>용용이 비구름</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #e8f4f8;
      font-family: sans-serif;
    }
    .time-header {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 2px solid #3498db;
      text-align: center;
      white-space: nowrap;
    }
    .gps-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      border: 2px solid #3498db;
      font-size: 20px;
    }
    .yongyong-box {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 2px solid #2ecc71;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 85%;
    }
    .yongyong-avatar {
      font-size: 32px;
      line-height: 1;
    }
    .yongyong-text {
      font-size: 14px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <div class="time-header" id="timeHeader">🐉 용용이 비구름 감지 중...</div>
  <div class="gps-btn" id="gpsBtn">🎯</div>
  <div id="map"></div>

  <div class="yongyong-box">
    <div class="yongyong-avatar">🐲</div>
    <div class="yongyong-text" id="yongSpeech">용용이가 현재 위치의 비구름을 살펴보고 있어요!</div>
  </div>

  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([36.5, 127.5], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let radarLayer = null;
    let userMarker = null;

    async function loadRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();
        
        if (data.radar && data.radar.past && data.radar.past.length > 0) {
          const lastFrame = data.radar.past[data.radar.past.length - 1];
          const time = new Date(lastFrame.time * 1000);
          
          const month = String(time.getMonth() + 1).padStart(2, '0');
          const day = String(time.getDate()).padStart(2, '0');
          const hours = String(time.getHours()).padStart(2, '0');
          const minutes = String(time.getMinutes()).padStart(2, '0');
          
          document.getElementById('timeHeader').innerText = `🐉 레이더: ${month}월 ${day}일 ${hours}시 ${minutes}분`;

          if (radarLayer) map.removeLayer(radarLayer);

          radarLayer = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${lastFrame.time}/256/{z}/{x}/{y}/2/1_1.png`, {
            opacity: 0.6,
            zIndex: 500
          }).addTo(map);
        }
      } catch (e) {
        document.getElementById('timeHeader').innerText = '🐉 레이더 정보를 가져오지 못했어요';
      }
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          map.setView([lat, lng], 10);
          
          if (userMarker) map.removeLayer(userMarker);
          
          const customIcon = L.divIcon({
            html: '<div style="font-size:30px; transform:translate(-50%, -50%);">🐲</div>',
            className: '',
            iconSize: [30, 30]
          });
          
          userMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
          document.getElementById('yongSpeech').innerText = "용용이가 찾아낸 현재 위치예요! 비구름 위치를 확인해보세요 🌧️";
        }, () => {
          document.getElementById('yongSpeech').innerText = "위치 권한을 켜주셔야 용용이가 내 위치를 찾을 수 있어요!";
        });
      }
    }

    document.getElementById('gpsBtn').addEventListener('click', locateUser);

    loadRadar();
    locateUser();
    setInterval(loadRadar, 300000);
  </script>
</body>
</html>
